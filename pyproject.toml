[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sub-utils"
dynamic = ["version"]
description = "Subtitle manipulation commandline utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pysubs2"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sub-inject = "sub_utils.inject:main"
sub-splitaudio = "sub_utils.splitaudio:main"
sub-cat = "sub_utils.cat:main"
sub-apply-style = "sub_utils.apply_style:main"
